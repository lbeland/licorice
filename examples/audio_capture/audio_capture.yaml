# Read audio over line in, manipulate it, and output over line out

config:
  tick_len: 10000
  # num_ticks: 2
  source_init_ticks: 10

signals:
  audio_signal_source:
    shape: (441, )
    dtype: int16
    history: 10000
  
  audio_signal_sink:
    shape: (441, )
    dtype: int16
    history: 1000

modules:
  audio_in:
    language: python
    in:  
      name: audio_source
      # async: True
      args:
        type: line
        pcm:
          device: "default"
          mode: 0  # SND_PCM_NONBLOCK # SND_PCM_ASYNC
          access: SND_PCM_ACCESS_RW_INTERLEAVED
          format: SND_PCM_FORMAT_S16
          channels: 1
          rate: 44100
          buffer_time: 0  # ring buffer length in us
          period_time: 10000  # period time in us
          periods: 2
      schema:
        max_packets_per_tick: 2
        data:
          dtype: int16
          size: 441

    out:
      - audio_signal_source

  audio_process:
    constructor: True
    language: python
    in:
      - audio_signal_source
    out:
      - audio_signal_sink

  audio_out:
    language: python
    in:
      - audio_signal_sink
    out:  
      name: audio_sink
      # async: True
      args:
        type: line
        pcm:
          device: "default"
          mode: 0  # SND_PCM_NONBLOCK # SND_PCM_ASYNC
          access: SND_PCM_ACCESS_RW_INTERLEAVED
          format: SND_PCM_FORMAT_S16
          channels: 1
          rate: 44100
          buffer_time: 0 # ring buffer length in us
          period_time: 10000  # period time in us
          periods: 2
      schema:
        data:
          dtype: int16
          size: 441

  audio_vis:
    language: python
    constructor: true
    parser: true
    destructor: true
    in:
      - audio_signal_source
    out:
      name: viz
      async: True
      args:
        type: vis_pygame
